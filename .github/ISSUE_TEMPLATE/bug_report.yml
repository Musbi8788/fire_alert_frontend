name: 🐛 Bug Report
description: Report something that isn't working as expected in the frontend.
title: "fix: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please search [existing issues](../) first to avoid duplicates.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear description of the bug and its impact.
      placeholder: When I click "Submit Report", the page...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or screen recording
      description: If applicable, add visuals to help explain the problem. You can paste images directly.
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser & OS
      placeholder: "e.g. Chrome 124 on Windows 11, Safari on iOS 17"
    validations:
      required: true
  - type: input
    id: api-base
    attributes:
      label: Which backend were you pointing at?
      description: The value of VITE_API_BASE_URL (local backend, the live demo API, etc.).
      placeholder: "e.g. https://fire-alert-backend-production.up.railway.app"
    validations:
      required: false
  - type: textarea
    id: console
    attributes:
      label: Console / network errors
      description: Paste any relevant errors from the browser dev tools console or network tab.
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this is not a duplicate.
          required: true
        - label: This is a frontend issue (server-side bugs belong in the backend repo).
          required: false
